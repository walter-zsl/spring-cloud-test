app:
  id: store-gateway

apollo:
  meta: http://127.0.0.1:8080
  # 直连 Config Service，避免 Eureka 登记的 Docker 内网 IP（如 172.19.x）在宿主机上连不通、长轮询超时
  config-service: http://127.0.0.1:8080

spring:
  application:
    name: store-gateway
  config:
    import:
      - optional:apollo://application
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            - id: store-sample
              uri: lb://store-sample
              predicates:
                - Path=/store-sample/**
              filters:
                - StripPrefix=1
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

server:
  port: 18080
