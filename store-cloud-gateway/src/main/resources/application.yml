# 公共配置（全部环境共用）
app:
  id: store-gateway

spring:
  profiles:
    default: local
  application:
    name: store-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            # /auth/** → store-cloud-auth（OAuth2/JWT 派发）
            - id: store-auth-service
              uri: lb://store-auth-service
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            # 对外前缀 /user/...、/order/...，去掉首段后转发到各服务原有路径
            - id: store-user-service
              uri: lb://store-user-service
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            - id: store-order-service
              uri: lb://store-order-service
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

server:
  port: 18080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: store-auth-service
        url: /auth/v3/api-docs
      - name: store-user-service
        url: /user/v3/api-docs
      - name: store-order-service
        url: /order/v3/api-docs

---
# 生产/联 Apollo：SPRING_PROFILES_ACTIVE=prod
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:apollo://application

apollo:
  meta: ${APOLLO_META:http://127.0.0.1:8080}
  config-service: ${APOLLO_CONFIG_SERVICE:http://127.0.0.1:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
