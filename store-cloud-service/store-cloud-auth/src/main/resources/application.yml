# 认证中心：签发 JWT（对称 HS256）；业务服务仅做 Resource Server 校验（issue-tokens: false）。
app:
  id: store-auth-service

store:
  security:
    user-source: bootstrap
    jwt:
      secret: ${JWT_SECRET:please-change-this-secret-demo-placeholder-min-length-utf8-abc!!}
      issue-tokens: true
      validate-incoming-jwt: false
      expiration-minutes: 60
      issuer: store-auth-service
      enforce-strong-secret: true

spring:
  profiles:
    default: local
  application:
    name: store-auth-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        fail-fast: false

server:
  port: 19082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:apollo://application

store:
  security:
    jwt:
      enforce-strong-secret: true

apollo:
  meta: ${APOLLO_META:http://127.0.0.1:8080}
  config-service: ${APOLLO_CONFIG_SERVICE:http://127.0.0.1:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
